name: Site stats

# Daily refresh of site-stats.json for the "Site Snapshot" panel.
# Needs a repo secret GOATCOUNTER_TOKEN (GoatCounter → Settings → API,
# permission "Read statistics").
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC, about 2am ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch GoatCounter stats
        env:
          GC_CODE: sankarwork
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 .github/scripts/site_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-stats.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update site-stats.json"
            git pull --rebase --autostash
            git push
          fi
